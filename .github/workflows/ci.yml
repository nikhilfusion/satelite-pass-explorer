name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  quality:
    name: Lint · Format · Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint:js
      - run: npm run lint:css
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Build the real database so the real-dataset regression tests run (they skip locally otherwise).
      - name: Cache DuckDB database
        id: db-cache
        uses: actions/cache@v4
        with:
          path: data/db
          key: duckdb-${{ hashFiles('data/*.json', 'apps/api/src/infra/**') }}
      - if: steps.db-cache.outputs.cache-hit != 'true'
        run: npm run ingest
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run build
      - run: npm run ingest
      - name: Start the app
        run: |
          WEB_DIST=apps/web/dist LOG_LEVEL=warn nohup npm start > server.log 2>&1 &
          npx --yes wait-on http-get://localhost:3000/api/health --timeout 60000
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            server.log
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [quality, test]
    permissions:
      contents: read
      packages: write # push to GHCR (main / tags only)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - name: Build (cached) and load for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: orbit-explorer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container (first-boot ingest + API + SPA)
        run: |
          docker run -d --name orbit -p 3000:3000 \
            -v "$PWD/data:/data/source:ro" orbit-explorer:ci
          for i in $(seq 1 60); do
            curl -fs localhost:3000/api/health && break || sleep 2
          done
          curl -fs localhost:3000/api/meta | grep -q YAM20
          curl -fs localhost:3000/ | grep -qi "<title>Orbit Explorer"
          docker logs orbit
      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: orbit-explorer:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
